name = "plainvoice-pay"
main = "src/index.ts"
compatibility_date = "2026-04-27"
compatibility_flags = ["nodejs_compat"]

# KV namespace IDs from `wrangler kv namespace create LICENSES`
# and `wrangler kv namespace create PAYMENTS`. See README "Deploy bootstrap".
[[kv_namespaces]]
binding = "LICENSES"
id = "22fc1d88e2034628a500307c5c6a9c82"
preview_id = "22fc1d88e2034628a500307c5c6a9c82"

[[kv_namespaces]]
binding = "PAYMENTS"
id = "d2429a43a9aa43c188b7858e1744c083"
preview_id = "d2429a43a9aa43c188b7858e1744c083"

[vars]
FRONTEND_URL = "https://plainvoice.de"
ALLOWED_ORIGINS = "https://plainvoice.de"

# Secrets — set via `wrangler secret put`, never committed:
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_ID
#   RESEND_API_KEY
#   RESEND_FROM_ADDRESS
